[project]
name = "aipt-analyzer"
version = "0.1.0"
description = "AI PT쌤 로컬 분석기: Pi 영상 -> 자세 추정 -> rep 판정 -> 영상 오버레이 + 백엔드 업로드"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "opencv-python>=4.9",
    "pillow>=10",
    "httpx>=0.27",
]

[project.optional-dependencies]
# 자세 추정 모델 (torch를 끌고 와서 무거우므로 분리)
yolo = ["ultralytics>=8.3"]
dev = ["pytest>=8"]

[project.scripts]
aipt-analyzer = "aipt_analyzer.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["aipt_analyzer*"]

[tool.setuptools.package-data]
aipt_analyzer = ["configs/*.json"]
