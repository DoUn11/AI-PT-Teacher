[project]
name = "ai-pt-teacher-backend"
version = "0.1.0"
description = "AI PT쌤 백엔드 (모듈형 모놀리스)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.4",
    "email-validator>=2.1",
    "pyjwt>=2.9",
    "bcrypt>=4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]
# 운영 DB(PostgreSQL)를 쓸 때만 설치
postgres = ["psycopg[binary]>=3.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
